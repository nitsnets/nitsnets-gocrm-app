name: NitsNetsCRM
options:
  bundleIdPrefix: com.nitsnets
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    DEVELOPMENT_TEAM: T5922VMWM7
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: '1,2'
    CRM_DEFAULT_API_URL: ''
targets:
  NitsNetsCRM:
    type: application
    platform: iOS
    sources: [NitsNetsCRM]
    entitlements:
      path: NitsNetsCRM/NitsNetsCRM.entitlements
      properties:
        keychain-access-groups: ["$(AppIdentifierPrefix)com.nitsnets.crm"]
    info:
      path: NitsNetsCRM/Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLName: com.nitsnets.crm.oauth
            CFBundleURLSchemes: [com.nitsnets.crm]
        CFBundleDisplayName: gocrm
        CRMDefaultAPIURL: $(CRM_DEFAULT_API_URL)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSMicrophoneUsageDescription: Dicta una nota privada después de tus encuentros.
        NSSpeechRecognitionUsageDescription: Convierte tu dictado en texto para revisarlo antes de asociarlo a un contacto.
        NSLocalNetworkUsageDescription: Conecta con el servidor CRM de tu red durante el desarrollo.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nitsnets.crm
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
  NitsNetsCRMTests:
    type: bundle.unit-test
    platform: iOS
    sources: [NitsNetsCRMTests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: NitsNetsCRM
  NitsNetsCRMUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [NitsNetsCRMUITests]
    dependencies:
      - target: NitsNetsCRM
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  NitsNetsCRM:
    build:
      targets:
        NitsNetsCRM: all
    test:
      targets: [NitsNetsCRMTests]
  NitsNetsCRMLiveSmoke:
    build:
      targets:
        NitsNetsCRM: all
    test:
      targets: [NitsNetsCRMUITests]
